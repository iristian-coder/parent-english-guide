<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="亲子英语">
<title>亲子英语速查手册</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF8F4;
  --card: #FFFFFF;
  --text: #1E1B18;
  --muted: #A8998E;
  --border: #F0E8E0;
  --shadow: 0 3px 14px rgba(0,0,0,0.07);
  --nav-h: 72px;
  --accent: #FF6B35;
  --accent-light: #FFF0EB;
  --green: #34C759;
  --green-light: #EDFBF1;
  --purple: #8B6FD4;
  --purple-light: #F0ECFF;
  --blue: #3B9EFF;
  --blue-light: #EBF5FF;
  --yellow: #FFB800;
  --yellow-light: #FFF8E1;
  --pink: #FF4F87;
  --pink-light: #FFF0F5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ─── HEADER ─── */
.header {
  background: var(--card);
  padding: 0 16px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1.5px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #FF6B35, #FF4F87);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  box-shadow: 0 3px 8px rgba(255,107,53,0.35);
}
.header-title { font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 900; }
.header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.header-right { display: flex; gap: 8px; }
.icon-circle {
  width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.icon-circle:active { background: var(--border); }

/* ─── PAGES ─── */
.pages { flex: 1; overflow: hidden; position: relative; }
.page { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px calc(var(--nav-h) + 24px); display: none; }
.page.active { display: block; }

/* ─── SECTION LABEL ─── */
.section-label {
  font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: 0.8px; text-transform: uppercase;
  margin: 6px 0 10px 2px;
}

/* ─── DAILY CARD ─── */
.daily-card {
  background: linear-gradient(135deg, #FF6B35 0%, #FF4F87 100%);
  border-radius: 20px; padding: 18px 18px 16px;
  margin-bottom: 20px; box-shadow: 0 6px 20px rgba(255,107,53,0.3);
  position: relative; overflow: hidden;
}
.daily-card::before {
  content: '✨'; position: absolute; right: 14px; top: 12px;
  font-size: 40px; opacity: 0.2;
}
.daily-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.75); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
.daily-en { font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 900; color: white; line-height: 1.35; margin-bottom: 5px; }
.daily-zh { font-size: 13px; color: rgba(255,255,255,0.82); margin-bottom: 14px; }
.daily-actions { display: flex; gap: 8px; }
.daily-btn {
  padding: 8px 16px; border-radius: 20px; border: none;
  font-size: 13px; font-weight: 700; font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: transform 0.1s;
}
.daily-btn:active { transform: scale(0.95); }
.daily-btn.primary { background: white; color: var(--accent); }
.daily-btn.ghost { background: rgba(255,255,255,0.2); color: white; border: 1.5px solid rgba(255,255,255,0.4); }

/* ─── SCENE GRID ─── */
.scene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scene-tile {
  border-radius: 18px; border: 1.5px solid transparent;
  padding: 16px 14px 14px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform 0.12s; display: flex; flex-direction: column; gap: 5px;
  position: relative; overflow: hidden;
}
.scene-tile:active { transform: scale(0.95); }
.tile-emoji { font-size: 30px; margin-bottom: 2px; }
.tile-name { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; }
.tile-count { font-size: 11px; opacity: 0.65; font-weight: 600; }
.tile-fav-dot { position: absolute; top: 10px; right: 10px; font-size: 12px; }

/* Tile color themes */
.tile-0 { background: linear-gradient(135deg, #FFF3EE, #FFE8DC); color: #C44A1A; border-color: #FFD4C0; }
.tile-1 { background: linear-gradient(135deg, #EDF8F1, #D6F3E3); color: #1A7A40; border-color: #B8EDD0; }
.tile-2 { background: linear-gradient(135deg, #EEF3FF, #DDE6FF); color: #2040A0; border-color: #BFD0FF; }
.tile-3 { background: linear-gradient(135deg, #FFF6E5, #FFECC0); color: #9A6200; border-color: #FFD97A; }
.tile-4 { background: linear-gradient(135deg, #F5F0FF, #EAE0FF); color: #5230A0; border-color: #C8B8FF; }
.tile-5 { background: linear-gradient(135deg, #FFF0F5, #FFE0EC); color: #A0204A; border-color: #FFB8D0; }
.tile-6 { background: linear-gradient(135deg, #E8FBFF, #D0F4FF); color: #0A6080; border-color: #A0E4F8; }
.tile-7 { background: linear-gradient(135deg, #FFF8E0, #FFF0B0); color: #806000; border-color: #FFE080; }
.tile-8 { background: linear-gradient(135deg, #F0FFF4, #DCFFE8); color: #186030; border-color: #A0ECC0; }
.tile-9 { background: linear-gradient(135deg, #FFF2F8, #FFE0F4); color: #801840; border-color: #FFC0E8; }

/* ─── PHRASE LIST ─── */
.scene-page-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.back-btn {
  width: 36px; height: 36px; border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--card); display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
}
.scene-page-emoji { font-size: 26px; flex-shrink: 0; }
.scene-page-title { font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 900; }
.scene-page-hint { font-size: 12px; color: var(--muted); margin-top: 1px; }
.add-phrase-btn {
  margin-left: auto; background: var(--accent); color: white; border: none;
  border-radius: 20px; padding: 8px 16px; font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif; cursor: pointer; font-weight: 700;
  white-space: nowrap; flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(255,107,53,0.3);
}

/* ─── PHRASE CARD ─── */
.phrase-card {
  background: var(--card); border-radius: 16px; border: 1.5px solid var(--border);
  padding: 14px 13px 14px 18px; margin-bottom: 10px; box-shadow: var(--shadow);
  position: relative; overflow: hidden; transition: transform 0.1s;
}
.phrase-card:active { transform: scale(0.99); }
.phrase-card.is-fav::before { background: var(--yellow); }
.phrase-card.used-recently { border-color: #C8EDD8; }
.phrase-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: var(--accent); border-radius: 5px 0 0 5px;
}
.card-top { display: flex; align-items: flex-start; }
.card-text { flex: 1; min-width: 0; }
.en { font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; line-height: 1.4; margin-bottom: 4px; }
.zh { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.card-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.tip-badge { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 700; }
.used-badge { display: inline-block; background: var(--green-light); color: var(--green); font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 700; }
.card-actions { display: flex; flex-direction: row; gap: 7px; padding-top: 10px; border-top: 1px solid var(--border); }
.action-btn {
  flex: 1; height: 34px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer; transition: all 0.12s;
}
.action-btn:active { transform: scale(0.94); }
.action-btn.speaking { background: var(--accent-light); border-color: var(--accent); }
.action-btn.copied { background: var(--green-light); border-color: var(--green); }
.action-btn.fav-on { background: var(--yellow-light); border-color: var(--yellow); }

/* ─── FAVORITES PAGE ─── */
.fav-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.fav-empty-icon { font-size: 48px; margin-bottom: 12px; }
.fav-empty-text { font-size: 15px; line-height: 1.8; }

/* ─── HISTORY PAGE ─── */
.history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.clear-btn { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
.history-item {
  background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
  padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow);
}
.history-en { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; margin-bottom: 2px; }
.history-zh { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.history-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.history-count { background: var(--accent-light); color: var(--accent); font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 700; }
.history-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; line-height: 2; }

/* ─── EDIT PAGE ─── */
.edit-section-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.8px; margin-bottom: 10px; text-transform: uppercase; }
.edit-scene-row {
  background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
  padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow);
}
.edit-scene-emoji { font-size: 24px; flex-shrink: 0; }
.edit-scene-info { flex: 1; min-width: 0; }
.edit-scene-name { font-weight: 700; font-size: 15px; }
.edit-scene-count { font-size: 11px; color: var(--muted); margin-top: 2px; }
.edit-scene-btns { display: flex; gap: 6px; flex-shrink: 0; }
.edit-icon-btn { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
.edit-icon-btn.danger { background: #FFF0F0; border-color: #FFCDD2; }
.add-scene-btn {
  width: 100%; padding: 15px; border-radius: 16px; border: 2px dashed var(--border);
  background: transparent; font-size: 14px; color: var(--muted); cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif; margin-top: 4px;
  transition: border-color 0.15s, color 0.15s;
}
.add-scene-btn:hover, .add-scene-btn:active { border-color: var(--accent); color: var(--accent); }

/* ─── SEARCH ─── */
.search-overlay {
  position: absolute; inset: 0; background: var(--bg); z-index: 50;
  display: none; flex-direction: column; padding-bottom: var(--nav-h);
}
.search-overlay.open { display: flex; }
.search-bar { padding: 12px 14px; background: var(--card); border-bottom: 1.5px solid var(--border); display: flex; gap: 10px; align-items: center; }
.search-bar input {
  flex: 1; padding: 10px 16px; border-radius: 22px; border: 1.5px solid var(--border);
  font-size: 15px; font-family: 'Noto Sans SC', sans-serif; background: var(--bg); outline: none; color: var(--text);
}
.search-bar input:focus { border-color: var(--accent); }
.search-cancel { font-size: 14px; color: var(--accent); cursor: pointer; white-space: nowrap; font-weight: 700; }
.search-results { flex: 1; overflow-y: auto; padding: 12px 14px; }
.search-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; line-height: 2; }
.cat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }

/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; height: var(--nav-h);
  background: var(--card); border-top: 1.5px solid var(--border);
  display: flex; align-items: stretch; z-index: 20;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; border: none; background: none;
  font-family: 'Noto Sans SC', sans-serif; color: var(--muted); transition: color 0.15s; padding: 0;
}
.nav-item.active { color: var(--accent); }
.nav-item.active .nav-icon { transform: scale(1.15); }
.nav-icon { font-size: 22px; line-height: 1; transition: transform 0.15s; }
.nav-label { font-size: 10px; font-weight: 700; }

/* ─── MODAL ─── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--card); border-radius: 24px 24px 0 0; padding: 24px 18px 36px;
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
}
.modal-drag { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 18px; }
.modal-title { font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 900; margin-bottom: 16px; }
.modal label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; margin-top: 14px; letter-spacing: 0.3px; }
.modal input, .modal textarea {
  width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--border);
  font-size: 15px; font-family: 'Noto Sans SC', sans-serif; background: var(--bg); outline: none; color: var(--text);
  transition: border-color 0.15s;
}
.modal input:focus, .modal textarea:focus { border-color: var(--accent); }
.modal textarea { resize: vertical; min-height: 78px; line-height: 1.6; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.btn-primary { flex: 1; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #FF6B35, #FF4F87); color: white; font-size: 16px; font-weight: 800; font-family: 'Noto Sans SC', sans-serif; cursor: pointer; box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
.btn-secondary { flex: 1; padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; font-family: 'Noto Sans SC', sans-serif; cursor: pointer; }
.del-btn { width: 100%; padding: 13px; border-radius: 14px; border: 1.5px solid #FFCDD2; background: #FFF5F5; color: #C62828; font-size: 14px; font-family: 'Noto Sans SC', sans-serif; cursor: pointer; margin-top: 12px; font-weight: 600; }

/* ─── TOAST ─── */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 18px); left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: #1E1B18; color: white; font-size: 13px; font-weight: 600;
  padding: 10px 22px; border-radius: 22px; opacity: 0; transition: all 0.22s;
  z-index: 300; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }


/* ─── STORY FULL VIEW ─── */
.story-full-card {
  background: var(--card); border-radius: 18px; border: 1.5px solid var(--border);
  padding: 22px 20px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.story-full-en {
  font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 700;
  line-height: 2; color: var(--text); margin-bottom: 16px;
}
.story-full-divider {
  height: 1px; background: var(--border); margin-bottom: 14px;
}
.story-full-zh {
  font-size: 13px; color: var(--muted); line-height: 2.2;
}
.story-bottom-actions {
  display: flex; gap: 10px; margin-bottom: 14px;
}
.story-action-big {
  flex: 1; padding: 13px; border-radius: 14px; border: none;
  background: var(--accent); color: white; font-size: 15px; font-weight: 700;
  font-family: 'Noto Sans SC', sans-serif; cursor: pointer;
  box-shadow: 0 3px 10px rgba(255,107,53,0.3);
}
.story-action-big.ghost {
  background: var(--bg); color: var(--muted); border: 1.5px solid var(--border);
  box-shadow: none; font-weight: 500;
}
.story-para-list {
  background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
  overflow: hidden; margin-bottom: 10px;
}
.story-para-toggle {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 16px; cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600;
}
.story-para-row {
  padding: 11px 16px; border-top: 1px solid var(--border);
}
.story-para-row-en { font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.story-para-row-zh { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.story-para-row-btns { display: flex; gap: 6px; }
/* ─── STORY LIST ─── */
.story-card {
  background: var(--card); border-radius: 18px; border: 1.5px solid var(--border);
  padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; gap: 14px;
}
.story-card:active { transform: scale(0.97); }
.story-card-emoji { font-size: 32px; flex-shrink: 0; }
.story-card-info { flex: 1; min-width: 0; }
.story-card-title { font-family: "Nunito", sans-serif; font-size: 17px; font-weight: 900; margin-bottom: 3px; }
.story-card-hint { font-size: 12px; color: var(--muted); }
.story-card-count { font-size: 11px; color: var(--muted); margin-top: 4px; }
.add-story-btn {
  width: 100%; padding: 16px; border-radius: 18px; border: 2px dashed var(--border);
  background: transparent; font-size: 14px; color: var(--muted); cursor: pointer;
  font-family: "Noto Sans SC", sans-serif; margin-top: 4px;
  transition: border-color 0.15s, color 0.15s;
}
.add-story-btn:active { border-color: var(--accent); color: var(--accent); }

/* ─── STORY READER ─── */
.story-para {
  background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
  padding: 14px 16px 12px 20px; margin-bottom: 10px; box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.story-para::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--blue); border-radius: 4px 0 0 4px;
}
.story-en { font-family: "Nunito", sans-serif; font-size: 16px; font-weight: 700; line-height: 1.5; margin-bottom: 5px; color: var(--text); }
.story-zh { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.story-para-actions { display: flex; gap: 7px; padding-top: 9px; border-top: 1px solid var(--border); }

/* ─── PICTUREBOOK ─── */
.pb-card {
  background: var(--card); border-radius: 18px; border: 1.5px solid var(--border);
  padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; gap: 14px;
}
.pb-card:active { transform: scale(0.97); }
.pb-card-emoji { font-size: 32px; flex-shrink: 0; }
.pb-card-info { flex: 1; min-width: 0; }
.pb-card-title { font-family: "Nunito", sans-serif; font-size: 17px; font-weight: 900; margin-bottom: 3px; }
.pb-card-hint { font-size: 12px; color: var(--muted); }
.pb-card-count { font-size: 11px; color: var(--muted); margin-top: 4px; }
.pb-page-card {
  background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
  padding: 14px 16px 12px 20px; margin-bottom: 10px; box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.pb-page-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--green); border-radius: 4px 0 0 4px;
}
.pb-page-num { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
.pb-page-text { font-family: "Nunito", sans-serif; font-size: 16px; font-weight: 700; line-height: 1.5; margin-bottom: 4px; }
.pb-page-zh { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.pb-page-guide { background: var(--green-light); border-radius: 8px; padding: 6px 10px; font-size: 11px; color: #1A7A40; font-weight: 600; margin-bottom: 10px; }
.pb-page-actions { display: flex; gap: 7px; padding-top: 9px; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">🌱</div>
    <div>
      <div class="header-title">亲子英语</div>
      <div class="header-sub">宝宝语言启蒙速查手册</div>
    </div>
  </div>
  <div class="header-right">
    <div class="icon-circle" onclick="openSearch()">🔍</div>
  </div>
</div>

<div class="pages">

  <!-- HOME -->
  <div class="page active" id="page-home">
    <div id="dailyWrap"></div>
    <div class="section-label">所有场景</div>
    <div class="scene-grid" id="sceneGrid"></div>
  </div>

  <!-- PHRASES -->
  <div class="page" id="page-phrases">
    <div class="scene-page-header">
      <div class="back-btn" onclick="goHome()">←</div>
      <div class="scene-page-emoji" id="phrasePageEmoji"></div>
      <div style="flex:1;min-width:0;">
        <div class="scene-page-title" id="phrasePageTitle"></div>
        <div class="scene-page-hint" id="phrasePageHint"></div>
      </div>
      <button class="add-phrase-btn" onclick="openAddPhrase()">＋ 添加</button>
    </div>
    <div id="phraseList"></div>
  </div>

  <!-- FAVORITES -->
  <div class="page" id="page-fav">
    <div class="section-label" style="margin-top:4px;">我的收藏 ⭐</div>
    <div id="favList"></div>
  </div>

  <!-- HISTORY -->
  <div class="page" id="page-history">
    <div class="history-header">
      <div class="section-label" style="margin:0;">学习记录 📈</div>
      <div class="clear-btn" onclick="clearHistory()">清空记录</div>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- EDIT -->
  <div class="page" id="page-edit">
    <div class="edit-section-title">场景管理</div>
    <div id="editSceneList"></div>
    <button class="add-scene-btn" onclick="openAddScene()">＋ 新建场景</button>
  </div>

  <!-- PICTUREBOOK -->
  <div class="page" id="page-picturebook">
    <div id="pbList"></div>
  </div>

  <!-- PICTUREBOOK READER -->
  <div class="page" id="page-pb-reader">
    <div class="scene-page-header">
      <div class="back-btn" onclick="goPicturebooks()">←</div>
      <div style="flex:1;min-width:0;">
        <div class="scene-page-title" id="pbReaderTitle"></div>
        <div class="scene-page-hint" id="pbReaderHint"></div>
      </div>
      <button class="add-phrase-btn" onclick="openEditPb()">✏️ 编辑</button>
    </div>
    <div id="pbContent"></div>
  </div>

  <!-- STORIES -->
  <div class="page" id="page-stories">
    <div id="storiesList"></div>
  </div>

  <!-- STORY READER -->
  <div class="page" id="page-story-reader">
    <div class="scene-page-header">
      <div class="back-btn" onclick="goStories()">←</div>
      <div style="flex:1;min-width:0;">
        <div class="scene-page-title" id="storyReaderTitle"></div>
        <div class="scene-page-hint" id="storyReaderHint"></div>
      </div>
      <button class="add-phrase-btn" onclick="openEditStory()">✏️ 编辑</button>
    </div>
    <div id="storyContent"></div>
  </div>

  <!-- SEARCH OVERLAY -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-bar">
      <input type="search" id="searchInput" placeholder="搜索场景或句子…" autocomplete="off" oninput="doSearch(this.value)">
      <div class="search-cancel" onclick="closeSearch()">取消</div>
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-empty">输入关键词开始搜索<br>支持中英文 🔤</div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active" id="nav-home" onclick="switchNav('home')">
    <span class="nav-icon">🏠</span><span class="nav-label">场景</span>
  </button>
  <button class="nav-item" id="nav-picturebook" onclick="switchNav('picturebook')">
    <span class="nav-icon">🎨</span><span class="nav-label">绘本</span>
  </button>
  <button class="nav-item" id="nav-stories" onclick="switchNav('stories')">
    <span class="nav-icon">📖</span><span class="nav-label">故事</span>
  </button>
  <button class="nav-item" id="nav-fav" onclick="switchNav('fav')">
    <span class="nav-icon">⭐</span><span class="nav-label">收藏</span>
  </button>
  <button class="nav-item" id="nav-history" onclick="switchNav('history')">
    <span class="nav-icon">📈</span><span class="nav-label">记录</span>
  </button>
  <button class="nav-item" id="nav-edit" onclick="switchNav('edit')">
    <span class="nav-icon">✏️</span><span class="nav-label">编辑</span>
  </button>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="modalSave()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  saveFavs();
  // update card style in current list
  if (currentSceneId) renderPhraseList(currentSceneId);
}

function recordUsage(en, zh, sceneLabel) {
  const existing = history.find(h => h.en === en);
  if (existing) { existing.count++; existing.lastUsed = Date.now(); }
  else { history.unshift({ en, zh, sceneLabel, count: 1, lastUsed: Date.now() }); }
  if (history.length > 200) history = history.slice(0, 200);
  saveHistory();
}

// ─── SPEECH ───
let usVoice = null;
function loadVoices() {
  const all = speechSynthesis.getVoices();
  usVoice = all.find(v => v.name === 'Samantha')
    || all.find(v => v.name.includes('Google') && v.lang === 'en-US')
    || all.find(v => v.lang === 'en-US')
    || all.find(v => v.lang.startsWith('en'));
}
loadVoices();
if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;

function speak(text, btn) {
  if (!('speechSynthesis' in window)) { showToast('浏览器不支持朗读'); return; }
  speechSynthesis.cancel();
  if (activeSpeakBtn === btn) {
    btn.textContent = '🔊'; btn.classList.remove('speaking'); activeSpeakBtn = null; return;
  }
  if (activeSpeakBtn) { activeSpeakBtn.textContent = '🔊'; activeSpeakBtn.classList.remove('speaking'); }
  const utt = new SpeechSynthesisUtterance(text);
  if (!usVoice) loadVoices();
  if (usVoice) utt.voice = usVoice;
  utt.lang = 'en-US'; utt.rate = 0.85; utt.pitch = 1.0;
  btn.textContent = '⏹'; btn.classList.add('speaking'); activeSpeakBtn = btn;
  utt.onend = utt.onerror = () => { btn.textContent = '🔊'; btn.classList.remove('speaking'); if (activeSpeakBtn === btn) activeSpeakBtn = null; };
  speechSynthesis.speak(utt);
}

// ─── COPY ───
function copyAndFlash(en, zh, sceneLabel, btn) {
  recordUsage(en, zh, sceneLabel);
  const flash = () => { btn.textContent = '✅'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = '📋'; btn.classList.remove('copied'); }, 1300); };
  if (navigator.clipboard) navigator.clipboard.writeText(en).then(flash);
  else { const t = document.createElement('textarea'); t.value = en; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); flash(); }
}

// ─── DAILY ───
let dailyPhrase = null;
function renderDaily() {
  const allPhrases = [];
  scenes.forEach(s => s.phrases.forEach(p => allPhrases.push({en:p.en,zh:p.zh,sceneLabel:s.label})));
  const i = Math.floor(Date.now() / 86400000) % allPhrases.length;
  dailyPhrase = allPhrases[i];
  const p = dailyPhrase;
  document.getElementById('dailyWrap').innerHTML = `
    <div class="daily-card">
      <div class="daily-label">✨ 今日推荐句子</div>
      <div class="daily-en">${p.en}</div>
      <div class="daily-zh">${p.zh}</div>
      <div class="daily-actions">
        <button class="daily-btn primary" id="dailySpeakBtn" onclick="speakDaily(this)">🔊 朗读</button>
        <button class="daily-btn ghost" onclick="copyDaily(this)">📋 复制</button>
      </div>
    </div>
  `;
}

function speakDaily(btn) { if (dailyPhrase) speak(dailyPhrase.en, btn); }
function copyDaily(btn) {
  if (!dailyPhrase) return;
  recordUsage(dailyPhrase.en, dailyPhrase.zh, dailyPhrase.sceneLabel);
  if (navigator.clipboard) navigator.clipboard.writeText(dailyPhrase.en).then(() => { btn.textContent = '✅ 已复制'; setTimeout(() => btn.textContent = '📋 复制', 1300); });
}

// ─── RENDER PHRASES ───
function renderPhraseList(sceneId) {
  const scene = getScene(sceneId); if (!scene) return;
  document.getElementById('phrasePageEmoji').textContent = scene.emoji;
  document.getElementById('phrasePageTitle').textContent = scene.label;
  document.getElementById('phrasePageHint').textContent = scene.hint;
  document.getElementById('phraseList').innerHTML = scene.phrases.map((p,i) => buildCard(p, sceneId, i, '')).join('');
}

function buildCard(p, sceneId, idx, catLabel) {
  const fav = sceneId ? isFav(sceneId, p.en) : false;
  const used = history.find(h => h.en === p.en);
  const scene = getScene(sceneId);
  const sceneLabel = scene ? scene.label : '';
  const editBtn = sceneId ? `<button class="action-btn" onclick="openEditPhrase('${sceneId}',${idx})">✏️</button>` : '';
  const favBtn = sceneId ? `<button class="action-btn ${fav?'fav-on':''}" onclick="toggleFavIdx('${sceneId}',${idx},this)">${fav?'⭐':'☆'}</button>` : '';
  return `<div class="phrase-card ${fav?'is-fav':''} ${used?'used-recently':''}">
    ${catLabel ? `<div class="cat-label">${catLabel}</div>` : ''}
    <div class="card-top">
      <div class="card-text">
        <div class="en">${p.en}</div>
        <div class="zh">${p.zh}</div>
        <div class="card-badges">
          ${p.tip ? `<span class="tip-badge">💡 ${p.tip}</span>` : ''}
          ${used ? `<span class="used-badge">已用 ${used.count} 次</span>` : ''}
        </div>
      </div>
    </div>
    <div class="card-actions">
      <button class="action-btn" onclick="speakIdx('${sceneId}',${idx},this)">🔊</button>
      <button class="action-btn" onclick="copyIdx('${sceneId}',${idx},this)">📋</button>
      ${favBtn}
      ${editBtn}
    </div>
  </div>`;
}

// ─── RENDER FAVS ───
function renderFavs() {
  const el = document.getElementById('favList');
  if (!favs.length) {
    el.innerHTML = `<div class="fav-empty"><div class="fav-empty-icon">⭐</div><div class="fav-empty-text">还没有收藏任何句子<br>点击句子卡片上的 ☆ 来收藏</div></div>`;
    return;
  }
  const cards = [];
  favs.forEach(k => {
    const [sid, ...rest] = k.split('::'); const en = rest.join('::');
    const scene = getScene(sid); if (!scene) return;
    const p = scene.phrases.find(x => x.en === en);
    const pObj = p || {en, zh:'', tip:''};
    const i = scene.phrases.indexOf(pObj);
    cards.push(buildCard(pObj, sid, i, scene.emoji + ' ' + scene.label));
  });
  el.innerHTML = cards.join('') || '<div class="fav-empty"><div class="fav-empty-text">收藏的句子暂时无法找到</div></div>';
}

// ─── RENDER HISTORY ───
function renderHistory() {
  const el = document.getElementById('historyList');
  if (!history.length) {
    el.innerHTML = '<div class="history-empty">还没有学习记录<br>使用句子后会自动记录在这里 📝</div>';
    return;
  }
  const sorted = [...history].sort((a,b) => b.lastUsed - a.lastUsed);
  el.innerHTML = sorted.map(h => {
    const d = new Date(h.lastUsed);
    const timeStr = d.toLocaleDateString('zh-CN', {month:'numeric',day:'numeric'}) + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    return `<div class="history-item">
      <div class="history-en">${h.en}</div>
      <div class="history-zh">${h.zh}</div>
      <div class="history-meta">
        <span>${h.sceneLabel || ''}</span>
        <span class="history-count">使用 ${h.count} 次</span>
        <span>${timeStr}</span>
      </div>
    </div>`;
  }).join('');
}

function clearHistory() {
  if (!confirm('确定清空所有学习记录？')) return;
  history = []; saveHistory(); renderHistory(); showToast('已清空记录');
}

// ─── NAV ───
let currentNav = 'home';
function switchNav(tab) {
  ['home','picturebook','stories','fav','history','edit'].forEach(t => document.getElementById('nav-'+t).classList.toggle('active', t===tab));
  if (tab === 'home') { goHome(); return; }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  currentNav = tab;
  if (tab === 'picturebook') renderPbList();
  else if (tab === 'stories') renderStoriesList();
  else if (tab === 'fav') renderFavs();
  else if (tab === 'history') renderHistory();
  else if (tab === 'edit') renderEditList();

}

function goHome() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-home').classList.add('active');
  ['home','picturebook','stories','fav','history','edit'].forEach(t => document.getElementById('nav-'+t).classList.toggle('active', t==='home'));
  renderHome(); currentSceneId = null; currentNav = 'home';
  speechSynthesis.cancel && speechSynthesis.cancel();
}

function openScene(id) {
  currentSceneId = id;

// ─── SEARCH ───
function openSearch() {
  document.getElementById('searchOverlay').classList.add('open');
  setTimeout(() => document.getElementById('searchInput').focus(), 80);
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('open');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '<div class="search-empty">输入关键词开始搜索<br>支持中英文 🔤</div>';
  speechSynthesis.cancel && speechSynthesis.cancel();
}
function doSearch(q) {
  q = (q||'').trim().toLowerCase();
  const el = document.getElementById('searchResults');
  if (!q) { el.innerHTML = '<div class="search-empty">输入关键词开始搜索<br>支持中英文 🔤</div>'; return; }
  const res = [];
  scenes.forEach(scene => scene.phrases.forEach((p,i) => {
    if (p.en.toLowerCase().includes(q) || p.zh.includes(q) || scene.label.includes(q))
      res.push({p, scene, i});
  }));
  el.innerHTML = res.length
    ? res.map(r => buildCard(r.p, r.scene.id, r.i, r.scene.emoji+' '+r.scene.label)).join('')
    : `<div class="search-empty">没有找到"${q}"相关句子 😅</div>`;
}

function deletePhrase(sceneId, idx) {
  if (!confirm('确定删除？')) return;
  const scene = getScene(sceneId); if (!scene) return;
  const en = scene.phrases[idx].en;
  favs = favs.filter(f => f !== favKey(sceneId, en));
  scene.phrases.splice(idx, 1);
  save(); saveFavs(); renderPhraseList(sceneId); closeModal(); showToast('已删除');
}

    s.label = document.getElementById('m-label').value.trim() || s.label;

    const b = getPb(modalTarget); if (!b) return;
    b.emoji = document.getElementById('m-emoji').value.trim() || b.emoji;
    b.title = document.getElementById('m-title').value.trim() || b.title;

    b.hint = document.getElementById('m-hint').value.trim();

    s.paras.push({ en, zh:(document.getElementById('m-zh').value||'').trim() });

    if (!en) { showToast('英文内容不能为空'); return; }

            <div class="story-para-row-en">${p.en}</div>
            <div class="story-para-row-zh">${p.zh}</div>
            <div class="story-para-row-btns">
              <button class="action-btn" onclick="speakStory('${sid}',${i},this)">🔊</button>
              <button class="action-btn" onclick="openEditPara('${sid}',${i})">✏️</button>
            </div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

function toggleParaList(sid) {
  const el = document.getElementById('storyParaExpand-' + sid);
  const arrow = document.getElementById('storyParaArrow-' + sid);
  const open = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  arrow.textContent = open ? '∨' : '›';
}

function speakStoryAll(storyId, btn) {
  const s = getStory(storyId); if (!s) return;
  const fullText = s.paras.map(p => p.en).join(' ');
  speak(fullText, btn);
}

function goStories() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-stories').classList.add('active');
  ['home','picturebook','stories','fav','history','edit'].forEach(t => document.getElementById('nav-'+t).classList.toggle('active', t==='stories'));
  renderStoriesList();
  speechSynthesis.cancel && speechSynthesis.cancel();
}

function openAddStory() {
  modalMode = 'add-story'; modalTarget = null;
  openModal('新建故事', `
    <label>Emoji 图标</label><input id="m-emoji" maxlength="4" value="📖">
    <label>中文标题</label><input id="m-title" placeholder="例如 小熊去超市">
    <label>英文标题</label><input id="m-title-en" placeholder="例如 Bear Goes to the Supermarket">
    <label>描述</label><input id="m-hint" placeholder="一句话介绍">
  `);
  setTimeout(() => document.getElementById('m-title').focus(), 120);
}

function openEditStory() {
  const s = getStory(currentStoryId); if (!s) return;
  modalMode = 'edit-story'; modalTarget = currentStoryId;
  openModal('编辑故事信息', `
    <label>Emoji 图标</label><input id="m-emoji" maxlength="4" value="${s.emoji}">
    <label>中文标题</label><input id="m-title" value="${s.title}">
    <label>英文标题</label><input id="m-title-en" value="${s.titleEn}">
    <label>描述</label><input id="m-hint" value="${s.hint}">
    <button class="del-btn" onclick="deleteStory('${s.id}')">🗑 删除这个故事</button>
  `);
}

function openAddPara(storyId) {
  modalMode = 'add-para'; modalTarget = { storyId };
  openModal('添加段落', `
    <label>英文</label><textarea id="m-en" placeholder="Liubao smiled."></textarea>
    <label>中文</label><textarea id="m-zh" placeholder="六堡笑了。"></textarea>
  `);
  setTimeout(() => document.getElementById('m-en').focus(), 120);
}

function openEditPara(storyId, idx) {
  const s = getStory(storyId); if (!s) return;
  const p = s.paras[idx];
  modalMode = 'edit-para'; modalTarget = { storyId, idx };
  openModal('编辑段落', `
    <label>英文</label><textarea id="m-en">${p.en}</textarea>
    <label>中文</label><textarea id="m-zh">${p.zh}</textarea>
    <button class="del-btn" onclick="deletePara('${storyId}',${idx})">🗑 删除这段</button>
  `);
}

function deleteStory(id) {
  if (!confirm('确定删除这个故事？')) return;
  stories = stories.filter(s => s.id !== id);
  saveStories(); closeModal(); goStories(); showToast('故事已删除');
}

function deletePara(storyId, idx) {
  if (!confirm('确定删除这段？')) return;
  const s = getStory(storyId); if (!s) return;
  s.paras.splice(idx, 1);
  saveStories(); renderStoryContent(s); closeModal(); showToast('已删除');
}


function speakIdx(sceneId, idx, btn) {
  const scene = getScene(sceneId);
  if (scene && scene.phrases[idx]) speak(scene.phrases[idx].en, btn);
}
function copyIdx(sceneId, idx, btn) {
  const scene = getScene(sceneId);
  if (!scene || !scene.phrases[idx]) return;
  const p = scene.phrases[idx];
  copyAndFlash(p.en, p.zh, scene.label, btn);
}
function toggleFavIdx(sceneId, idx, btn) {
  const scene = getScene(sceneId);
  if (scene && scene.phrases[idx]) toggleFav(sceneId, scene.phrases[idx].en, scene.phrases[idx].zh, btn);
}
function speakStory(storyId, idx, btn) {
  const s = getStory(storyId);
  if (s && s.paras[idx]) speak(s.paras[idx].en, btn);
}
function copyStory(storyId, idx, btn) {
  const s = getStory(storyId);
  if (!s || !s.paras[idx]) return;
  copyAndFlash(s.paras[idx].en, s.paras[idx].zh, s.title, btn);
}

let picturebooks = JSON.parse(localStorage.getItem('peg_pb_v2') || 'null') || DEFAULT_PB;
let currentPbId = null;
function savePb() { localStorage.setItem('peg_pb_v2', JSON.stringify(picturebooks)); }
function getPb(id) { return picturebooks.find(b => b.id === id); }

function renderPbList() {
  const el = document.getElementById('pbList');
  el.innerHTML = '<div class="section-label" style="margin-top:4px;">绘本导读 🎨</div>' +
    picturebooks.map(b => `
    <div class="pb-card" onclick="openPb('${b.id}')">
      <div class="pb-card-emoji">${b.emoji}</div>
      <div class="pb-card-info">
        <div class="pb-card-title">${b.title}</div>
        <div class="pb-card-hint">${b.series} · ${b.titleZh}</div>
        <div class="pb-card-count">${b.pages.length} 页 · ${b.hint}</div>
      </div>
      <div style="font-size:20px;color:var(--muted);">›</div>
    </div>`).join('') +
    `<button class="add-story-btn" onclick="openAddPb()">＋ 添加绘本</button>`;
}

function openPb(id) {
  currentPbId = id;
  const b = getPb(id); if (!b) return;
  document.getElementById('pbReaderTitle').textContent = b.emoji + ' ' + b.title;
  document.getElementById('pbReaderHint').textContent = b.series + ' · ' + b.hint;
  renderPbContent(b);
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-pb-reader').classList.add('active');
}

function renderPbContent(b) {
  const bid = b.id;
  document.getElementById('pbContent').innerHTML = b.pages.map((pg, i) => {
    return `<div class="pb-page-card">
      <div class="pb-page-num">${pg.pageNum}</div>
      <div class="pb-page-text">${pg.en}</div>
      <div class="pb-page-zh">${pg.zh}</div>
      ${pg.guide ? `<div class="pb-page-guide">💬 ${pg.guide}</div>` : ''}
      <div class="pb-page-actions">
        <button class="action-btn" style="flex:1" onclick="speakPb('${bid}',${i},this)">🔊 朗读</button>
        <button class="action-btn" style="flex:1" onclick="copyPb('${bid}',${i},this)">📋 复制</button>
        <button class="action-btn" style="width:36px;flex:none" onclick="openEditPbPage('${bid}',${i})">✏️</button>
      </div>
    </div>`;
  }).join('') +
  `<button class="add-story-btn" style="margin-top:4px" onclick="openAddPbPage('${b.id}')">＋ 添加页面</button>`;
}

function goPicturebooks() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-picturebook').classList.add('active');
  ['home','picturebook','stories','fav','history','edit'].forEach(t => document.getElementById('nav-'+t).classList.toggle('active', t==='picturebook'));
  renderPbList();
  speechSynthesis.cancel && speechSynthesis.cancel();
}

function speakPb(bid, idx, btn) { const b = getPb(bid); if (b && b.pages[idx]) speak(b.pages[idx].en, btn); }
function copyPb(bid, idx, btn) {
  const b = getPb(bid); if (!b || !b.pages[idx]) return;
  copyAndFlash(b.pages[idx].en, b.pages[idx].zh, b.title, btn);
}

function openAddPb() {
  modalMode = 'add-pb'; modalTarget = null;
  openModal('添加绘本', `
    <label>Emoji 图标</label><input id="m-emoji" maxlength="4" value="📚">
    <label>英文书名</label><input id="m-title" placeholder="The Very Hungry Caterpillar">
    <label>中文书名</label><input id="m-title-zh" placeholder="好饿的毛毛虫">
    <label>系列/级别</label><input id="m-series" placeholder="牛津树 Stage 2">
    <label>简介</label><input id="m-hint" placeholder="一句话介绍">
  `);
  setTimeout(() => document.getElementById('m-title').focus(), 120);
}

function openEditPb() {
  const b = getPb(currentPbId); if (!b) return;
  modalMode = 'edit-pb'; modalTarget = currentPbId;
  openModal('编辑绘本信息', `
    <label>Emoji 图标</label><input id="m-emoji" maxlength="4" value="${b.emoji}">
    <label>英文书名</label><input id="m-title" value="${b.title}">
    <label>中文书名</label><input id="m-title-zh" value="${b.titleZh}">
    <label>系列/级别</label><input id="m-series" value="${b.series}">
    <label>简介</label><input id="m-hint" value="${b.hint}">
    <button class="del-btn" onclick="deletePb('${b.id}')">🗑 删除这本绘本</button>
  `);
}

function openAddPbPage(bid) {
  modalMode = 'add-pb-page'; modalTarget = { bid };
  openModal('添加页面', `
    <label>页码</label><input id="m-pagenum" placeholder="第6页">
    <label>英文原文</label><textarea id="m-en" placeholder="The caterpillar was hungry."></textarea>
    <label>中文翻译</label><textarea id="m-zh" placeholder="毛毛虫很饿。"></textarea>
    <label>讲读引导（可选）</label><textarea id="m-guide" placeholder="引导孩子看图或互动的句子"></textarea>
  `);
  setTimeout(() => document.getElementById('m-pagenum').focus(), 120);
}

function openEditPbPage(bid, idx) {
  const b = getPb(bid); if (!b) return;
  const pg = b.pages[idx];
  modalMode = 'edit-pb-page'; modalTarget = { bid, idx };
  openModal('编辑页面', `
    <label>页码</label><input id="m-pagenum" value="${pg.pageNum}">
    <label>英文原文</label><textarea id="m-en">${pg.en}</textarea>
    <label>中文翻译</label><textarea id="m-zh">${pg.zh}</textarea>
    <label>讲读引导</label><textarea id="m-guide">${pg.guide||''}</textarea>
    <button class="del-btn" onclick="deletePbPage('${bid}',${idx})">🗑 删除这页</button>
  `);
}

function deletePb(id) {
  if (!confirm('确定删除这本绘本？')) return;
  picturebooks = picturebooks.filter(b => b.id !== id);
  savePb(); closeModal(); goPicturebooks(); showToast('绘本已删除');
}
function deletePbPage(bid, idx) {
  if (!confirm('确定删除这页？')) return;
  const b = getPb(bid); if (!b) return;
  b.pages.splice(idx, 1);
  savePb(); renderPbContent(b); closeModal(); showToast('已删除');
}
